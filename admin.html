<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>لوحة الإدارة</title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>


<body>


<!-- =========================================
     Login
========================================= -->

<div
    id="loginBox"
    class="login-card"
>

    <h1>🔐 لوحة الإدارة</h1>

    <p>
        الدخول متاح لحساب الإدارة فقط.
    </p>

    <div class="login-divider">أو</div>

    <label class="login-label">الإيميل</label>
    <input id="loginEmail" class="login-input" type="email" placeholder="name@example.com" autocomplete="username">

    <label class="login-label">كلمة المرور</label>
    <input id="loginPassword" class="login-input" type="password" placeholder="كلمة المرور" autocomplete="current-password">

    <button id="emailLoginBtn" type="button" class="email-login-btn">دخول المستخدم</button>

    <button
        id="googleLoginBtn"
        type="button"
    >
        الدخول بحساب Google
    </button>

    <p
        id="loginMessage"
        class="message"
    ></p>

</div>



<!-- =========================================
     Admin App
========================================= -->

<div
    id="adminApp"
    class="admin-app"
    style="display:none;"
>


    <!-- =====================================
         Header
    ====================================== -->

    <header class="admin-header">

        <div>

            <h1>
                🎭 لوحة إدارة المسرح
            </h1>

            <span id="adminEmail"></span>

        </div>


        <div class="header-actions">

            <a href="index.html">
                عرض الموقع
            </a>

            <button
                id="logoutBtn"
                type="button"
            >
                تسجيل الخروج
            </button>

        </div>

    </header>



    <!-- =====================================
         Main
    ====================================== -->

    <main class="admin-container">


        <!-- =================================
             Events
        ================================== -->

        <section class="panel">

            <div class="panel-title">

                <h2>
                    الحفلات
                </h2>

                <button
                    id="newEventBtn"
                    type="button"
                >
                    + إضافة حفلة
                </button>

            </div>


            <div id="eventsAdminList"></div>

        </section>



        <!-- =================================
             Event Editor
        ================================== -->

        <section
            id="eventEditor"
            class="panel"
            style="display:none;"
        >

            <div class="panel-title">

                <h2 id="editorTitle">
                    إضافة حفلة
                </h2>

                <button
                    id="cancelEventBtn"
                    class="secondary"
                    type="button"
                >
                    إلغاء
                </button>

            </div>


            <input
                type="hidden"
                id="eventId"
            >


            <div class="form-grid">

                <label>

                    اسم الحفلة

                    <input
                        id="eventName"
                        type="text"
                    >

                </label>


                <label>

                    التاريخ

                    <input
                        id="eventDate"
                        type="date"
                    >

                </label>


                <label>

                    الوقت

                    <input
                        id="eventTime"
                        type="time"
                    >

                </label>


                <label>

                    السعر

                    <input
                        id="eventPrice"
                        type="number"
                        min="0"
                    >

                </label>


                <label class="full">

                    رابط صورة الحفلة

                    <input
                        id="eventPosterUrl"
                        type="url"
                        inputmode="url"
                        placeholder="https://example.com/poster.jpg"
                    >

                    <small class="field-help">
                        ضع رابطًا مباشرًا للصورة من أي خدمة استضافة صور. لا يتم رفع الصورة إلى Firebase Storage.
                    </small>

                    <div id="posterPreview" class="poster-preview" style="display:none;">
                        <img id="posterPreviewImage" alt="معاينة صورة الحفلة">
                    </div>

                </label>


                <label>

                    مسؤول الحجز

                    <input
                        id="bookingManagerName"
                        type="text"
                        placeholder="اسم مسؤول الحجز"
                    >

                </label>


                <label>

                    رقم مسؤول الحجز

                    <input
                        id="bookingManagerPhone"
                        type="tel"
                        placeholder="01xxxxxxxxx"
                        inputmode="tel"
                    >

                </label>


                <label class="checkbox full">

                    <input
                        id="eventActive"
                        type="checkbox"
                        checked
                    >

                    الحفلة متاحة للحجز

                </label>

            </div>


            <button
                id="saveEventBtn"
                type="button"
            >
                حفظ الحفلة
            </button>


            <p
                id="eventMessage"
                class="message"
            ></p>

        </section>



        <!-- =================================
             User Management
        ================================== -->

        <section id="userManagementPanel" class="panel" style="display:none;">
            <div class="panel-title">
                <h2>👥 مستخدمو الإدارة</h2>
                <button id="newUserBtn" type="button">+ إنشاء مستخدم</button>
            </div>

            <div id="userEditor" class="user-editor" style="display:none;">
                <div class="form-grid">
                    <label>اسم المستخدم<input id="userName" type="text" placeholder="اسم مسؤول الإدارة"></label>
                    <label>رقم الموبايل<input id="userPhone" type="tel" placeholder="01xxxxxxxxx" inputmode="tel"></label>
                    <label>الإيميل<input id="userEmail" type="email" placeholder="name@example.com"></label>
                    <label>كلمة المرور<input id="userPassword" type="password" placeholder="6 أحرف أو أكثر"></label>
                    <label class="checkbox full"><input id="userActive" type="checkbox" checked> المستخدم فعال</label>
                </div>
                <div class="assignment-box">
                    <h3>🎭 الحفلات المسموح بها</h3>
                    <div id="userEventAssignments" class="assignment-list"></div>
                </div>
                <input type="hidden" id="userId">
                <button id="saveUserBtn" type="button">حفظ المستخدم</button>
                <button id="cancelUserBtn" class="secondary" type="button">إلغاء</button>
                <p id="userMessage" class="message"></p>
            </div>

            <div id="usersList"></div>
        </section>

        <!-- =================================
             Bookings
        ================================== -->

        <section class="panel">

            <div class="panel-title">

                <h2>
                    الحجوزات
                </h2>


                <input
                    id="bookingSearch"
                    class="search"
                    type="text"
                    placeholder="بحث بالاسم أو رقم الحجز أو المقعد"
                >

            </div>


            <div id="bookingsList"></div>

        </section>


    </main>


</div>



<!-- =========================================
     Booking Modal
========================================= -->

<div
    id="bookingModal"
    class="modal"
    style="display:none;"
>

    <div class="modal-card">


        <div class="panel-title">

            <h2>
                تعديل الحجز
            </h2>


            <button
                id="closeBookingModal"
                class="secondary"
                type="button"
            >
                ✕
            </button>

        </div>


        <input
            type="hidden"
            id="editBookingId"
        >


        <input
            type="hidden"
            id="editEventId"
        >


        <label>

            الاسم

            <input
                id="editName"
                type="text"
            >

        </label>


        <label>

            الموبايل

            <input
                id="editPhone"
                type="tel"
            >

        </label>


        <label>

            المقاعد

            <input
                id="editSeats"
                type="text"
                placeholder="مثال: A1,A2,A3"
            >

        </label>


        <p
            id="bookingEditMessage"
            class="message"
        ></p>


        <!-- =================================
             Modal Actions
        ================================== -->

        <div class="modal-actions">


            <button
                id="saveBookingBtn"
                type="button"
            >
                ✏️ حفظ التعديل
            </button>


            <button
                id="deleteBookingBtn"
                class="danger"
                type="button"
            >
                ❌ إلغاء الحجز وتحرير المقاعد
            </button>


        </div>


    </div>

</div>



<!-- =========================================
     JavaScript
========================================= -->

<script
    type="module"
    src="js/admin.js"
></script>


</body>

</html>
